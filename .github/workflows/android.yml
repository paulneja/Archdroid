name: Android build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test, lint and build
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease
          --no-daemon
          --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: archdroid-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: archdroid-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v7
        with:
          name: archdroid-release-${{ github.run_number }}
          path: release-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="release-apk/ArchDroid-${GITHUB_REF_NAME}-unsigned.apk"
          mv release-apk/app-release-unsigned.apk "$asset"
          notes=$(printf 'Automated ARM64 build from commit `%s`.\n\nThis release contains an unsigned APK. The debug APK is available from the workflow run artifacts.' "$GITHUB_SHA")
          gh release create "$GITHUB_REF_NAME" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ArchDroid $GITHUB_REF_NAME" \
            --notes "$notes" \
            --generate-notes
