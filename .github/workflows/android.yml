name: Android build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label
        type: choice
        options: [ubuntu-24.04, archdroid-local]
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  build:
    name: Test and build APKs
    runs-on: ${{ inputs.runner || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.ARCHDROID_RUNNER) || 'ubuntu-24.04' }}
    env:
      # Only a flag is exposed job-wide; the secrets themselves stay on the steps that use them.
      HAS_KEYSTORE: ${{ secrets.ARCHDROID_KEYSTORE_BASE64 != '' }}
      ARCHDROID_KEYSTORE_FILE: /tmp/archdroid-release.jks

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          submodules: false

      - name: Check out native submodules
        run: |
          git submodule sync --recursive
          for attempt in 1 2 3; do
            git submodule update --init --recursive --depth=1 && exit 0
            sleep 5
          done
          exit 1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ARCHDROID_KEYSTORE_BASE64: ${{ secrets.ARCHDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ARCHDROID_KEYSTORE_BASE64" | base64 --decode > "$ARCHDROID_KEYSTORE_FILE"

      - name: Require release signing
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true'
        run: exit 1

      - name: Test, lint and build
        env:
          ARCHDROID_KEYSTORE_PASSWORD: ${{ secrets.ARCHDROID_KEYSTORE_PASSWORD }}
          ARCHDROID_KEY_ALIAS: ${{ secrets.ARCHDROID_KEY_ALIAS }}
          ARCHDROID_KEY_PASSWORD: ${{ secrets.ARCHDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease
          --no-daemon
          --console=plain

      - name: Remove release keystore
        if: always()
        run: rm -f "$ARCHDROID_KEYSTORE_FILE"

      - name: Verify release signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: archdroid-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: archdroid-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Package complete source
        run: python3 scripts/package-source.py build/archdroid-source.tar.gz "${GITHUB_REF_NAME//\//-}"

      - name: Upload source
        uses: actions/upload-artifact@v7
        with:
          name: archdroid-source-${{ github.run_number }}
          path: build/archdroid-source.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@v7

      - name: Download release APK
        uses: actions/download-artifact@v7
        with:
          name: archdroid-release-${{ github.run_number }}
          path: release-apk

      - name: Download source
        uses: actions/download-artifact@v7
        with:
          name: archdroid-source-${{ github.run_number }}
          path: release-source

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="release-apk/ArchDroid-${GITHUB_REF_NAME}.apk"
          mv release-apk/app-release.apk "$asset"
          source="release-source/ArchDroid-${GITHUB_REF_NAME}-source.tar.gz"
          mv release-source/archdroid-source.tar.gz "$source"
          gh release create "$GITHUB_REF_NAME" "$asset" "$source" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ArchDroid $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
