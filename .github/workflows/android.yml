name: Android build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    env:
      ARCHDROID_KEYSTORE_BASE64: ${{ secrets.ARCHDROID_KEYSTORE_BASE64 }}
      ARCHDROID_KEYSTORE_FILE: ${{ runner.temp }}/archdroid-release.jks
      ARCHDROID_KEYSTORE_PASSWORD: ${{ secrets.ARCHDROID_KEYSTORE_PASSWORD }}
      ARCHDROID_KEY_ALIAS: ${{ secrets.ARCHDROID_KEY_ALIAS }}
      ARCHDROID_KEY_PASSWORD: ${{ secrets.ARCHDROID_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Restore release keystore
        if: env.ARCHDROID_KEYSTORE_BASE64 != ''
        run: printf '%s' "$ARCHDROID_KEYSTORE_BASE64" | base64 --decode > "$ARCHDROID_KEYSTORE_FILE"

      - name: Require release signing
        if: startsWith(github.ref, 'refs/tags/v') && env.ARCHDROID_KEYSTORE_BASE64 == ''
        run: exit 1

      - name: Test, lint and build
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease
          --no-daemon
          --console=plain

      - name: Verify release signature
        if: env.ARCHDROID_KEYSTORE_BASE64 != ''
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: archdroid-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: archdroid-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v7
        with:
          name: archdroid-release-${{ github.run_number }}
          path: release-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="release-apk/ArchDroid-${GITHUB_REF_NAME}.apk"
          mv release-apk/app-release.apk "$asset"
          notes=$(printf 'Automated ARM64 build from commit `%s`.\n\nThis release contains the signed release APK. The debug APK is available from the workflow run artifacts.' "$GITHUB_SHA")
          gh release create "$GITHUB_REF_NAME" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ArchDroid $GITHUB_REF_NAME" \
            --notes "$notes" \
            --generate-notes
